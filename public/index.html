<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#157a60"><meta name="description" content="Daily Balance — خطتك اليومية للتغذية والمشي والتمارين"> <link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><title>Daily Balance | خطتك كل يوم</title><link rel="stylesheet" href="./styles.css"></head>
<body>
<div class="app">
  <header class="topbar">
    <div class="top-inner">
      <div class="brand"><div class="brand-mark">✦</div><div><b>Daily Balance</b><small>صحتك يوم ورا يوم</small></div></div>
      <div class="header-actions"><span id="cloudBadge" class="connection-badge">جارٍ التحميل...</span><button class="avatar" id="authBtn" aria-label="إعداد الحساب">◯</button></div>
    </div>
  </header>
  <div class="notice" id="notice" role="status" hidden></div>
  <main class="container" id="appMain"><div class="loading">بنجهّز خطتك اليومية...</div></main>
  <nav class="bottom-nav" aria-label="القائمة الرئيسية">
    <button data-view="today" class="nav-btn active"><span>⌂</span><small>النهاردة</small></button>
    <button data-view="meals" class="nav-btn"><span>▤</span><small>الوجبات</small></button>
    <button data-view="activity" class="nav-btn"><span>◉</span><small>الحركة</small></button>
    <button data-view="progress" class="nav-btn"><span>▥</span><small>التقدم</small></button>
    <button data-view="settings" class="nav-btn"><span>⚙</span><small>الإعدادات</small></button>
  </nav>
</div>
<div class="modal-backdrop" id="modal" hidden><div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal-titlebar"><h3 id="modalTitle"></h3><button class="icon-button" id="closeModal" aria-label="إغلاق">✕</button></div><div id="modalContent"></div></div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body></html>
